[project]
name = "battery-dataset"
version = "0.1.0"
description = "Synthetic multi-channel battery sensor dataset generator (PyBaMM) used as the client payload for the sorting / median-filter service"
readme = { text = "Synthetic multi-channel battery sensor dataset generator (PyBaMM), producing the client payload for the sorting / median-filter service.", content-type = "text/markdown" }
authors = [
    { name = "Anmol Krishhhhhhh", email = "162597538+Anmol-G-K@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pybamm>=26.9.0.0",
]

[project.scripts]
battery-dataset = "battery_dataset:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
